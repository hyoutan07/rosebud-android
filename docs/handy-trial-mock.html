<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handy テスト・共有</title>
<style>*{box-sizing:border-box}body{margin:0;background:#030712;color:#f3f4f6;font:14px/1.6 system-ui,sans-serif}main{max-width:420px;margin:20px auto;padding:22px}h1{font-size:22px;font-weight:500;margin:0}p,small{color:#aeb9c9}button,input,textarea{font:inherit;color:inherit}button{min-height:48px;border:0;border-radius:10px;background:#1f2937;padding:10px 14px}nav{display:flex;gap:6px;margin:20px 0}nav button{flex:1}nav button[aria-pressed=true]{background:#354055;color:#f9a8d4}label{display:block;margin:14px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea{width:100%;background:#111827;border:1px solid #374151;border-radius:8px;padding:10px}textarea{min-height:130px}.primary{width:100%;background:linear-gradient(90deg,#be185d,#6b21a8)}section{margin:18px 0}.note{font-size:12px}.actions{display:flex;gap:8px}.actions button{flex:1}pre{white-space:pre-wrap;color:#d1d5db;border-top:1px solid #374151;padding-top:12px}output{display:block;margin:14px 0}.stop{width:100%;color:#fca5a5;background:#4d1a25;margin:16px 0}[hidden]{display:none!important}</style>
<main><small>THE HANDY / テスト・共有 · 画面案</small><h1>動きを入力して確かめる</h1><p class="note">実機出力は準備中。ここでは入力内容と共有の形を確認します。</p>
<nav><button id="simple-tab" aria-pressed="true">かんたん往復</button><button id="sequence-tab" aria-pressed="false">位置列</button></nav>
<section id="simple"><div class="row"><label>下限（%）<input id="lower" type="number" placeholder="例：45"></label><label>上限（%）<input id="upper" type="number" placeholder="例：55"></label><label>片道（秒）<input id="half" type="number" placeholder="例：3.0"></label><label>往復回数<input id="cycles" type="number" value="1"></label></div><small>図の始点は下限です。現在位置は未取得。</small></section>
<section id="sequence" hidden><label>図の開始点（%）<input id="initial" type="number" placeholder="例：45"></label><label>目標位置（%）, 移動時間（秒）<textarea id="rows" placeholder="55, 3.0&#10;45, 3.0"></textarea></label><label>列の繰り返し<input id="repeats" type="number" value="1"></label></section>
<button class="primary" id="check">入力を確認</button><output id="result" aria-live="polite">未入力 · 実機未確認</output>
<details><summary>入力できる範囲</summary><p class="note">位置10〜90%、全体幅20ポイント以内。1区間2〜20秒、20区間/120秒まで。試作の制限で、実機の推奨値ではありません。</p></details>
<label>感想<textarea id="notes" placeholder="良かった点、変えたい点"></textarea></label>
<div class="actions"><button id="copy">条件をコピー</button><button id="share">共有</button></div><button class="stop" id="stop">すべて停止</button><pre id="data" hidden></pre>
</main><script>(()=>{const $=id=>document.getElementById(id);let mode='simple';function choose(m){mode=m;for(const id of ['simple','sequence']){$(id).hidden=id!==m;$(id+'-tab').setAttribute('aria-pressed',String(id===m))}$('result').textContent='未入力 · 実機未確認';$('data').hidden=true}for(const id of ['simple','sequence'])$(id+'-tab').onclick=()=>choose(id);function build(){let start,moves=[];if(mode==='simple'){let l=Number($('lower').value),u=Number($('upper').value),t=Number($('half').value),n=Number($('cycles').value);if(!$('lower').value||!$('upper').value||!$('half').value||l>=u||!Number.isInteger(n)||n<1||n>10)throw Error('下限・上限・秒数・回数を入力してください');start=l;for(let i=0;i<n;i++)moves.push([u,t],[l,t])}else{if(!$('initial').value)throw Error('図の開始点を入力してください');start=Number($('initial').value);const rows=$('rows').value.trim().split(/\n/).map(s=>s.split(',').map(Number));const n=Number($('repeats').value);if(!Number.isInteger(n)||n<1||n>10)throw Error('繰り返しは1〜10です');for(let i=0;i<n;i++)moves.push(...rows)}const positions=[start,...moves.map(x=>x[0])],total=moves.reduce((a,x)=>a+x[1],0);if(moves.length>20||moves.length===0||moves.some(x=>x.length!==2||!Number.isFinite(x[1])||x[1]<2||x[1]>20)||positions.some(x=>!Number.isFinite(x)||x<10||x>90)||Math.max(...positions)-Math.min(...positions)>20||total>120)throw Error('入力できる範囲を確認してください');return 'Handyテスト案 v1\n確認：入力内容のみ／実機未確認\n入力方式：'+(mode==='simple'?'かんたん往復':'位置列')+'\n図の開始点：'+start+'%\n'+moves.map((x,i)=>(i+1)+'. '+x[0]+'% / '+x[1]+'秒').join('\n')+'\n合計：'+total+'秒\n感想：'+$('notes').value}function show(){try{$('data').textContent=build();$('data').hidden=false;$('result').textContent='入力内容を確認 · 送信なし';return true}catch(e){$('result').textContent=e.message;return false}}$('check').onclick=show;$('copy').onclick=()=>{if(show()){$('result').textContent='アプリでは、この条件と感想をコピーします（画面案）'}};$('share').onclick=()=>{if(show())$('result').textContent='アプリではAndroidの共有画面を開きます（画面案）'};$('stop').onclick=()=>{$('result').textContent='画面例を終了 · 実機への送信なし'};})();</script></html>
